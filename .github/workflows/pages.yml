name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production site
        uses: actions/checkout@v4
        with:
          ref: main
          path: _site

      - name: Checkout dev preview
        uses: actions/checkout@v4
        with:
          ref: dev
          path: _dev

      - name: Build combined static site
        run: |
          rm -rf _site/.git _site/.github _site/AGENTS.md _site/dev
          mkdir -p _site/dev
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'AGENTS.md' \
            _dev/ _site/dev/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
